name: station bump version
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.SECRET }}
          release_branches: main
          force_bump: patch
      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        run: gh release create ${STEPS_TAG_OUTPUTS_NEW_TAG} --notes "${STEPS_TAG_OUTPUTS_CHANGELOG}"
        env:
          STEPS_TAG_OUTPUTS_NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          STEPS_TAG_OUTPUTS_CHANGELOG: ${{ steps.tag.outputs.changelog }}
          GH_TOKEN: ${{ github.token }}
